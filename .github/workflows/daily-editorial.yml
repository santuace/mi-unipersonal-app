name: Uruimporta Daily Editorial

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 AM UTC -> 8:00 AM Uruguay
  workflow_dispatch:

jobs:
  run-editorial-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push history back

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Editorial Engine and Send Email
      run: npx tsx src/scripts/uruimporta/engine.ts --send
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        WC_URL: ${{ secrets.WC_URL }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}

    - name: Commit and push tracking history
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add src/scripts/uruimporta/data/sent-history.json || true
        git commit -m "chore: Update sent-history.json after daily email" || echo "No changes to commit"
        git push || echo "No changes to push"
